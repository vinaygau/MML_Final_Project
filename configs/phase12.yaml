# Phase 12: Dialogue-aware comic assembly and export
# Key names must match DEFAULTS in src/comic/phase12.py

transcript_dir: data/subtitles
keyframes_dir: data/keyframes
layout_dir: data/layout
speaker_dir: data/speaker
emotion_dir: data/emotions
editorial_dir: data/editorial
styled_dir: data/outputs
output_dir: output/final_comic

# Bubble appearance
bubble_margin: 18
bubble_padding: 12
bubble_max_width_ratio: 0.75
bubble_max_height_ratio: 0.70
bubble_font_size: 19
bubble_min_font_size: 13
bubble_layout_max_coverage_ratio: 0.42
bubble_row_gap: 10
max_merged_dialogue_chars: 110
panels_per_page: 6
adaptive_pages: false
bubble_fill: "#fffdf7"
bubble_outline: "#171717"
bubble_text: "#111111"
panel_border_width: 3

# Page layout
page_width: 1200
page_height: 1200
page_margin: 28
panel_gap: 18

# Dialogue assignment
# Retain every aligned speech turn; Phase 8 distributes dense dialogue over panels.
max_bubbles_per_panel: 0
allow_duplicate_segments: false
fallback_nearest_segment_seconds: 3.0

# Export formats
export_pdf: true
export_cbz: true
export_html: true
